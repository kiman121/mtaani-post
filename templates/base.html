{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Mtaani{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,520;9..144,620&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/app.css' %}" />
  </head>
  <body class="{% block body_class %}app{% endblock %}">
    <a class="skip" href="#content">Skip to content</a>
    {% if request.resolver_match.url_name != "login" and request.resolver_match.url_name != "register-user" %}
    {% include "includes/nav.html" %}
    {% endif %}
    {% include "includes/messages.html" %}
    <main id="content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
